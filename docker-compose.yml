services:
  postgres:
    image: postgres:16-alpine
    container_name: confiahogar_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-confiahogar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confiahogar123}
      POSTGRES_DB: ${POSTGRES_DB:-confiahogar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confiahogar"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: confiahogar_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: confiahogar_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-confiahogar}:${POSTGRES_PASSWORD:-confiahogar123}@postgres:5432/${POSTGRES_DB:-confiahogar}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey_change_in_production_32chars}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: confiahogar
      FRONTEND_URL: http://localhost:3000
    volumes:
      - ./backend:/app:z
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: confiahogar_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_MINIO_URL: http://localhost:9000
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
